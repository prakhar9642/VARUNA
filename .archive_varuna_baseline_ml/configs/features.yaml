# VARUNA Baseline ML configuration - feature engineering
features:
  # Lead day mapping: 0-23h -> Day 1, 24-47h -> Day 2, ... 168-191h -> Day 8.
  # Verified against the dataset: lead_age_days = floor(lead_hours / 24).
  lead_day_offset: 1

  # Lead-time windows used for forecast "change" features.
  change_windows_hours: [12, 24, 48]

  # Historical rolling-error feature windows, measured in init cycles (daily).
  historical_windows_days: [30, 60, 90]
  # Minimum number of past cycles required before a historical feature is
  # non-missing; shorter history is filled with global priors (no future info).
  historical_min_cycles: 10

  # Multi-model spread / disagreement statistics to build per variable.
  ensemble_stats:
    - ensemble_mean
    - ensemble_median
    - ensemble_std
    - ensemble_min
    - ensemble_max
    - ensemble_range
    - ensemble_cv          # coefficient of variation (meaningful for positive vars)
    - inter_model_mae      # mean |model - ensemble median|

  # Feature groups enabled in the model.
  use_forecast_values: true
  use_spread_stats: true
  use_lead: true
  use_temporal_cycles: true
  use_location: true
  use_forecast_change: true
  use_cross_variable_context: true
  use_historical_error_stats: true
  use_missingness_flags: true
  use_admin1: true