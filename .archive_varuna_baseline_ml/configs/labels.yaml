# VARUNA Baseline ML configuration - bust (target) definition.
#
# A "forecast bust" is an operational statement: the forecast error is so large
# that the forecast should be treated as unreliable.
#
# thresholds are estimated ONLY from the training partition, never the test set.
labels:
  # Error metric used per variable.
  #   temperature: absolute error (degC)
  #   wind_speed_10m: absolute error (m/s)
  #   relative_humidity_2m: absolute error (%)
  #   precipitation: absolute error (mm) - robust for the long-tailed zero-heavy
  #     rainfall distribution because the threshold is a high training quantile.
  error_metric: "absolute_error"

  # Threshold estimation mode.
  #   per_variable_per_lead_day : a bust is "error exceeds the training 90th
  #     percentile for that variable and lead day". Keeps bust rate comparable
  #     across lead days and isolates genuinely exceptional errors.
  threshold_mode: "per_variable_per_lead_day"

  # High quantile of the training error distribution defining a bust.
  bust_percentile: 0.90

  # Aggregation of per-variable busts into an overall bust.
  #   any_variable : overall bust if any selected variable busts
  #   majority_variable : overall bust if more than half of selected variables bust
  overall_rule: "any_variable"

  # Variables that count towards the overall bust.
  overall_variables: [temperature_2m, precipitation, wind_speed_10m, relative_humidity_2m]

  # Minimum number of training rows required in a (variable, lead-day) cell
  # before its threshold is used; otherwise fall back to a coarser threshold.
  min_rows_per_cell: 1000

  # Binarized target names for the models.
  targets:
    temperature_2m: "bust_temperature_2m"
    precipitation: "bust_precipitation"
    wind_speed_10m: "bust_wind_speed_10m"
    relative_humidity_2m: "bust_relative_humidity_2m"
  overall_target: "overall_bust"