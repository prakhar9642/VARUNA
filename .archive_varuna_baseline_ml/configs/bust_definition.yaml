# VARUNA - forecast bust definition (operational, transparent, configurable).
#
# This file states, in natural language and machine-readable form, what
# VARUNA means by "forecast bust". See labels.yaml for the numeric knobs.
bust_definition:
  statement: >
    A forecast is a BUST for a given variable and lead day when the absolute
    error between the multi-model forecast consensus and the verifying
    ERA5-Land analysis exceeds the 90th percentile of the historical absolute
    error distribution for that variable and lead day, estimated from the
    TRAINING partition only.

  target_variables:
    - temperature_2m: "absolute error vs ERA5-Land (degC)"
    - precipitation: "absolute error vs ERA5-Land (mm), zero-inflated, long tail"
    - wind_speed_10m: "absolute error vs ERA5-Land (m/s)"
    - relative_humidity_2m: "absolute error vs ERA5-Land (%)"

  rationale: >
    Using a per-variable, per-lead-day training quantile keeps the bust event
    density comparable across lead days and isolates genuinely exceptional
    errors instead of letting the natural grow of error with lead time
    dominate the target. All thresholds are computed on TRAINING data only;
    the TEST partition is never used to set thresholds.

  leakage_rules:
    - "Truth is used ONLY to construct the retrospective training label."
    - "Truth is NEVER included among model features."
    - "Historical error statistics use only errors strictly before forecast issue time."
    - "No feature uses the realized error of the row being predicted."

  caveats: >
    ERA5-Land is the verification reference in the public prototype, not the
    operational NCMRWF grid. The bust definition is operational and may be
    recalibrated by domain experts before deployment.