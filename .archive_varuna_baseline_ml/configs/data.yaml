# VARUNA Baseline ML configuration - data paths and dataset settings
data:
  raw_dir: "data/raw/weather"
  processed_dir: "data/processed"
  interim_dir: "data/interim"
  hf_repo_id: "Arko007/weathergpt-d1-mos-dataset"
  hf_subfolder: "d1_mos"

  # Target variables and their forecast models (the NWP centres).
  variables:
    temperature_2m:
      label_name: temp
      models: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless]
      unit: "degC"
    precipitation:
      label_name: precip
      models: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless]
      unit: "mm"
    wind_speed_10m:
      label_name: wind
      models: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless]
      unit: "m/s"
    relative_humidity_2m:
      label_name: humidity
      models: [gfs_seamless, ecmwf_ifs025, icon_seamless, gem_seamless]
      unit: "%"

  # Expected physical ranges for validation (sanity only, not bounds).
  # Extreme real values are never removed automatically; only values
  # outside [-inf, inf] * and + certain physically impossible bands are flagged.
  physical_ranges_degc: [-80.0, 60.0]
  humidity_bounds: [0.0, 100.0]
  wind_min: 0.0
  precip_min: 0.0

  # Geographic bounds for Indian locations (continents: ~6.5N-37N, 68E-98E).
  lat_bounds: [2.0, 40.0]
  lon_bounds: [60.0, 100.0]

  # Load engine: polars | duckdb | pyarrow | pandas
  load_engine: "polars"
  # Fraction of rows to use for fast pipeline smoke tests (1.0 = everything).
  smoke_fraction: 0.01
  # Downcast floats to float32 to halve memory.
  float32: true

split:
  # Chronological split fractions (must sum to 1.0).
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  # Spatial holdout fraction of locations (must not appear in training).
  spatial_holdout_fraction: 0.20
  spatial_holdout_seed: 26081
  split_epoch_key: "init_time"