# VARUNA Baseline ML configuration - model training
model:
  primary: "xgboost"
  fallbacks: ["lightgbm", "hist_gradient_boosting"]

  # Forecast-error baselines (always computed).
  baselines:
    - no_bust            # always predict "no bust"
    - spread_threshold   # multi-model spread above a validation-tuned cutoff
    - historical_rate    # historical bust frequency near the same loc/lead
    - logistic_regression

  # XGBoost hyperparameter search grid (evaluated on validation only).
  xgboost_grid:
    learning_rate: [0.05, 0.1]
    max_depth: [4, 6, 8]
    n_estimators: [200, 400]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.7, 1.0]
    min_child_weight: [1, 5]

  # Fixed params applied on top of the grid trial.
  xgboost_fixed:
    objective: "binary:logistic"
    eval_metric: "aucpr"
    tree_method: "hist"
    n_jobs: -1

  # How many grid trials (random subset of the grid) to run.
  max_trials: 12

  # Class imbalance handling: scale_pos_weight auto-computes bust_rate/(1-bust_rate).
  balance_classes: true

  # Calibration: plattscaling | isotonic
  calibration_method: "isotonic"
  # Number of bins for reliability diagnostics.
  reliability_bins: 10

  # Early pipeline validation: train first on a subset.
  quick_start_rows: 100000
  quick_start_lead_max: 72