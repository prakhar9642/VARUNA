# VARUNA Baseline ML configuration - confidence categorization.
#
# confidence = 100 * (1 - calibrated_bust_probability)
confidence:
  bins:
    - {label: "HIGH", min: 80, max: 100}
    - {label: "MODERATE", min: 60, max: 79}
    - {label: "LOW", min: 40, max: 59}
    - {label: "VERY_LOW", min: 0, max: 39}

  # Optional explicit risk categories keyed on bust probability.
  risk_categories:
    - {label: "VERY_LOW_RISK",     min_p: 0.00, max_p: 0.20}
    - {label: "LOW_RISK",          min_p: 0.20, max_p: 0.40}
    - {label: "MODERATE_RISK",     min_p: 0.40, max_p: 0.60}
    - {label: "HIGH_RISK",         min_p: 0.60, max_p: 0.80}
    - {label: "VERY_HIGH_RISK",    min_p: 0.80, max_p: 1.00}